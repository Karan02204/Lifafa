version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: email_scheduler_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: email_scheduler

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine

    container_name: email_scheduler_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  mysql_data: